-center\&quot; title=\&quot;Copy\&quot;&gt;&lt;Copy className=\&quot;h-3.5 w-3.5\&quot; /&gt;&lt;/button&gt;\n          &lt;a href={`tel:${(primary || &#39;&#39;).replace(/[^0-9+]/g,&#39;&#39;)}`} className=\&quot;inline-flex items-center gap-1.5 rounded-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-3 h-9 text-sm font-semibold shadow-sm hover:shadow transition-shadow\&quot;&gt;\n            &lt;Phone className=\&quot;h-3.5 w-3.5\&quot; /&gt; Call\n          &lt;/a&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  );\n}\n\nfunction SOSButton({ onOpen, contacts }) {\n  const [open, setOpen] = useState(false);\n  const sosItems = useMemo(() =&gt; {\n    const pick = (id) =&gt; contacts.find(c =&gt; c.id === id);\n    return [pick(&#39;e-112&#39;), pick(&#39;e-100&#39;), pick(&#39;e-101&#39;), pick(&#39;e-102&#39;), pick(&#39;e-1091&#39;), pick(&#39;e-1098&#39;)].filter(Boolean);\n  }, [contacts]);\n\n  return (\n    &lt;&gt;\n      &lt;button\n        onClick={() =&gt; setOpen(true)}\n        className=\&quot;fixed bottom-6 right-6 z-40 h-16 w-16 rounded-full bg-gradient-to-br from-red-500 to-rose-600 text-white shadow-2xl pulse-ring flex items-center justify-center hover:scale-105 transition-transform\&quot;\n        aria-label=\&quot;Emergency SOS\&quot;\n      &gt;\n        &lt;Siren className=\&quot;h-7 w-7\&quot; /&gt;\n      &lt;/button&gt;\n\n      {open &amp;&amp; (\n        &lt;div className=\&quot;fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center\&quot; onClick={() =&gt; setOpen(false)}&gt;\n          &lt;div className=\&quot;w-full sm:max-w-md bg-card border border-border rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl fade-up\&quot; onClick={(e) =&gt; e.stopPropagation()}&gt;\n            &lt;div className=\&quot;flex items-center justify-between mb-4\&quot;&gt;\n              &lt;div className=\&quot;flex items-center gap-2\&quot;&gt;\n                &lt;div className=\&quot;h-10 w-10 rounded-full bg-red-500/15 text-red-500 flex items-center justify-center\&quot;&gt;&lt;Siren className=\&quot;h-5 w-5\&quot; /&gt;&lt;/div&gt;\n                &lt;div&gt;\n                  &lt;div className=\&quot;text-xs uppercase text-muted-foreground tracking-wider\&quot;&gt;Emergency SOS&lt;/div&gt;\n                  &lt;div className=\&quot;font-bold\&quot;&gt;Tap to call instantly&lt;/div&gt;\n                &lt;/div&gt;\n              &lt;/div&gt;\n              &lt;button onClick={() =&gt; setOpen(false)} className=\&quot;h-9 w-9 rounded-full hover:bg-accent flex items-center justify-center\&quot;&gt;&lt;X className=\&quot;h-4 w-4\&quot; /&gt;&lt;/button&gt;\n            &lt;/div&gt;\n            &lt;div className=\&quot;grid grid-cols-2 gap-2\&quot;&gt;\n              {sosItems.map(c =&gt; (\n                &lt;a key={c.id} href={`tel:${c.phone}`} className=\&quot;flex items-center gap-3 p-3 rounded-2xl bg-gradient-to-br from-red-500 to-rose-600 text-white shadow hover:shadow-lg transition-shadow\&quot;&gt;\n                  &lt;div className=\&quot;h-10 w-10 rounded-full bg-white/20 flex items-center justify-center font-bold\&quot;&gt;{c.phone}&lt;/div&gt;\n                  &lt;div className=\&quot;min-w-0\&quot;&gt;\n                    &lt;div className=\&quot;text-xs opacity-80\&quot;&gt;{c.subcategory}&lt;/div&gt;\n                    &lt;div className=\&quot;font-semibold truncate\&quot;&gt;{c.name}&lt;/div&gt;\n                  &lt;/div&gt;\n                &lt;/a&gt;\n              ))}\n            &lt;/div&gt;\n            &lt;button onClick={() =&gt; { setOpen(false); onOpen(&#39;emergency&#39;); }} className=\&quot;mt-4 w-full inline-flex items-center justify-center gap-2 h-11 rounded-full border border-border hover:bg-accent font-medium\&quot;&gt;\n              View all emergency numbers &lt;ChevronRight className=\&quot;h-4 w-4\&quot; /&gt;\n            &lt;/button&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n      )}\n    &lt;/&gt;\n  );\n}\n\nfunction App() {\n  const [query, setQuery] = useState(&#39;&#39;);\n  const debounced = useDebounce(query, 150);\n  const [suggestions, setSuggestions] = useState([]);\n  const [showDropdown, setShowDropdown] = useState(false);\n  const [categories, setCategories] = useState([]);\n  const [activeCategory, setActiveCategory] = useState(null); // null = home, or category id\n  const [categoryContacts, setCategoryContacts] = useState([]);\n  const [searchResults, setSearchResults] = useState([]);\n  const [featured, setFeatured] = useState([]);\n  const [selected, setSelected] = useState(null);\n  const [favorites, setFavorites] = useLocalStorage(&#39;qch:favs&#39;, []);\n  const [recent, setRecent] = useLocalStorage(&#39;qch:recent&#39;, []);\n  const [toast, setToast] = useState(&#39;&#39;);\n  const [allContacts, setAllContacts] = useState([]);\n  const searchRef = useRef(null);\n\n  useEffect(() =&gt; {\n    fetch(&#39;/api/categories&#39;).then(r =&gt; r.json()).then(d =&gt; setCategories(d.categories || []));\n    fetch(&#39;/api/featured&#39;).then(r =&gt; r.json()).then(d =&gt; setFeatured(d.contacts || []));\n    fetch(&#39;/api/contacts?limit=500&#39;).then(r =&gt; r.json()).then(d =&gt; setAllContacts(d.contacts || []));\n  }, []);\n\n  useEffect(() =&gt; {\n    if (!debounced) { setSuggestions([]); setSearchResults([]); return; }\n    fetch(`/api/contacts?q=${encodeURIComponent(debounced)}&amp;limit=30`).then(r =&gt; r.json()).then(d =&gt; {\n      setSuggestions((d.contacts || []).slice(0, 8));\n      setSearchResults(d.contacts || []);\n    });\n  }, [debounced]);\n\n  useEffect(() =&gt; {\n    if (!activeCategory) { setCategoryContacts([]); return; }\n    fetch(`/api/contacts?category=${activeCategory}&amp;limit=200`).then(r =&gt; r.json()).then(d =&gt; setCategoryContacts(d.contacts || []));\n  }, [activeCategory]);\n\n  const openContact = useCallback((c) =&gt; {\n    setSelected(c);\n    setRecent(prev =&gt; {\n      const next = [c.id, ...prev.filter(x =&gt; x !== c.id)].slice(0, 8);\n      return next;\n    });\n  }, [setRecent]);\n\n  const copyNumber = useCallback((msg, number) =&gt; {\n    if (number) { try { navigator.clipboard.writeText(number); } catch {} }\n    setToast(msg);\n  }, []);\n\n  const toggleFav = useCallback((id) =&gt; {\n    setFavorites(prev =&gt; prev.includes(id) ? prev.filter(x =&gt; x !== id) : [...prev, id]);\n  }, [setFavorites]);\n\n  const isFav = (id) =&gt; favorites.includes(id);\n  const contactById = (id) =&gt; allContacts.find(c =&gt; c.id === id);\n\n  const recentContacts = recent.map(contactById).filter(Boolean);\n  const favContacts = favorites.map(contactById).filter(Boolean);\n\n  const activeCategoryMeta = categories.find(c =&gt; c.id === activeCategory);\n\n  return (\n    &lt;div className=\&quot;min-h-screen bg-background text-foreground\&quot;&gt;\n      {/* NAVBAR */}\n      &lt;header className=\&quot;sticky top-0 z-30 backdrop-blur-xl bg-background/70 border-b border-border\&quot;&gt;\n        &lt;div className=\&quot;container mx-auto max-w-6xl px-4 h-16 flex items-center justify-between\&quot;&gt;\n          &lt;button onClick={() =&gt; { setActiveCategory(null); setQuery(&#39;&#39;); }} className=\&quot;flex items-center gap-2\&quot;&gt;\n            &lt;div className=\&quot;h-9 w-9 rounded-xl bg-gradient-to-br from-blue-500 to-red-500 flex items-center justify-center shadow-md\&quot;&gt;\n              &lt;Phone className=\&quot;h-4 w-4 text-white\&quot; /&gt;\n            &lt;/div&gt;\n            &lt;div className=\&quot;font-bold text-lg tracking-tight\&quot;&gt;Quick Contact Hub&lt;/div&gt;\n          &lt;/button&gt;\n          &lt;div className=\&quot;flex items-center gap-2\&quot;&gt;\n            &lt;div className=\&quot;hidden sm:flex items-center gap-1.5 text-xs text-muted-foreground pr-2\&quot;&gt;\n              &lt;ShieldCheck className=\&quot;h-3.5 w-3.5 text-emerald-500\&quot; /&gt; Verified\n            &lt;/div&gt;\n            &lt;ThemeToggle /&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/header&gt;\n\n      {/* CATEGORY VIEW */}\n      {activeCategory ? (\n        &lt;main className=\&quot;container mx-auto max-w-6xl px-4 py-8\&quot;&gt;\n          &lt;button onClick={() =&gt; setActiveCategory(null)} className=\&quot;inline-flex items-center gap-2 text-sm text-muted-foreground hover:text-foreground mb-4\&quot;&gt;\n            &lt;ArrowLeft className=\&quot;h-4 w-4\&quot; /&gt; Back to home\n          &lt;/button&gt;\n          &lt;div className=\&quot;flex items-center gap-4 mb-6\&quot;&gt;\n            {activeCategoryMeta &amp;&amp; (() =&gt; {\n              const Icon = ICONS[activeCategoryMeta.icon] || Phone;\n              const cc = COLOR_CLASSES[activeCategoryMeta.color] || COLOR_CLASSES.blue;\n              return (\n                &lt;div className={`h-14 w-14 rounded-2xl ${cc.bg} ${cc.text} flex items-center justify-center`}&gt;\n                  &lt;Icon className=\&quot;h-7 w-7\&quot; /&gt;\n                &lt;/div&gt;\n              );\n            })()}\n            &lt;div&gt;\n              &lt;h1 className=\&quot;text-2xl sm:text-3xl font-bold\&quot;&gt;{activeCategoryMeta?.name || activeCategory}&lt;/h1&gt;\n              &lt;p className=\&quot;text-sm text-muted-foreground\&quot;&gt;{activeCategoryMeta?.desc} · {categoryContacts.length} contacts&lt;/p&gt;\n            &lt;/div&gt;\n          &lt;/div&gt;\n          &lt;div className=\&quot;grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3\&quot;&gt;\n            {categoryContacts.map(c =&gt; (\n              &lt;ContactCard key={c.id} c={c} onOpen={openContact} onCopy={copyNumber} onFav={toggleFav} isFav={isFav(c.id)} /&gt;\n            ))}\n          &lt;/div&gt;\n        &lt;/main&gt;\n      ) : (\n        &lt;&gt;\n          {/* HERO */}\n          &lt;section className=\&quot;relative overflow-hidden\&quot;&gt;\n            &lt;div className=\&quot;absolute inset-0 -z-10\&quot;&gt;\n              &lt;div className=\&quot;absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[500px] bg-gradient-to-br from-blue-500/20 via-transparent to-red-500/20 blur-3xl rounded-full\&quot; /&gt;\n            &lt;/div&gt;\n            &lt;div className=\&quot;container mx-auto max-w-4xl px-4 pt-14 pb-10 text-center\&quot;&gt;\n              &lt;div className=\&quot;inline-flex items-center gap-2 rounded-full border border-border bg-card px-3 py-1 text-xs text-muted-foreground mb-6\&quot;&gt;\n                &lt;Sparkles className=\&quot;h-3.5 w-3.5 text-blue-500\&quot; /&gt; {allContacts.length}+ verified numbers · India\n              &lt;/div&gt;\n              &lt;h1 className=\&quot;text-4xl sm:text-6xl font-extrabold tracking-tight leading-[1.05]\&quot;&gt;\n                Find Every Important&lt;br /&gt;\n                &lt;span className=\&quot;bg-gradient-to-r from-blue-600 via-indigo-500 to-red-500 bg-clip-text text-transparent\&quot;&gt;Phone Number in Seconds&lt;/span&gt;\n              &lt;/h1&gt;\n              &lt;p className=\&quot;mt-4 text-muted-foreground text-lg max-w-xl mx-auto\&quot;&gt;\n                Emergency, government, banks, telecom, healthcare — one search, instant answers.\n              &lt;/p&gt;\n\n              {/* SEARCH */}\n              &lt;div className=\&quot;relative mt-8 max-w-2xl mx-auto\&quot; ref={searchRef}&gt;\n                &lt;div className=\&quot;relative\&quot;&gt;\n                  &lt;Search className=\&quot;absolute left-5 top-1/2 -translate-y-1/2 h-5 w-5 text-muted-foreground\&quot; /&gt;\n                  &lt;input\n                    value={query}\n                    onChange={(e) =&gt; { setQuery(e.target.value); setShowDropdown(true); }}\n                    onFocus={() =&gt; setShowDropdown(true)}\n                    onBlur={() =&gt; setTimeout(() =&gt; setShowDropdown(false), 150)}\n                    placeholder=&#39;Search \&quot;SBI customer care\&quot;, \&quot;ambulance\&quot;, \&quot;aadhaar\&quot;...&#39;\n                    className=\&quot;w-full h-16 pl-14 pr-14 rounded-full bg-card border border-border shadow-lg focus:shadow-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500/50 outline-none text-base transition-all\&quot;\n                  /&gt;\n                  {query &amp;&amp; (\n                    &lt;button onClick={() =&gt; setQuery(&#39;&#39;)} className=\&quot;absolute right-5 top-1/2 -translate-y-1/2 h-8 w-8 rounded-full hover:bg-accent flex items-center justify-center\&quot;&gt;\n                      &lt;X className=\&quot;h-4 w-4\&quot; /&gt;\n                    &lt;/button&gt;\n                  )}\n                &lt;/div&gt;\n\n                {/* AUTOCOMPLETE */}\n                {showDropdown &amp;&amp; query &amp;&amp; suggestions.length &gt; 0 &amp;&amp; (\n                  &lt;div className=\&quot;absolute top-full mt-2 w-full bg-card border border-border rounded-2xl shadow-2xl overflow-hidden z-20 fade-up text-left\&quot;&gt;\n                    {suggestions.map(s =&gt; (\n                      &lt;button key={s.id} onMouseDown={(e) =&gt; { e.preventDefault(); openContact(s); setShowDropdown(false); }} className=\&quot;w-full flex items-center justify-between gap-3 px-4 py-3 hover:bg-accent transition-colors border-b border-border last:border-0\&quot;&gt;\n                        &lt;div className=\&quot;min-w-0 flex-1\&quot;&gt;\n                          &lt;div className=\&quot;font-medium truncate\&quot;&gt;{s.name}&lt;/div&gt;\n                          &lt;div className=\&quot;text-xs text-muted-foreground\&quot;&gt;{s.subcategory || s.category}&lt;/div&gt;\n                        &lt;/div&gt;\n                        &lt;div className=\&quot;font-mono text-sm font-semibold text-blue-600 dark:text-blue-400 shrink-0\&quot;&gt;{s.phone || s.tollfree}&lt;/div&gt;\n                      &lt;/button&gt;\n                    ))}\n                  &lt;/div&gt;\n                )}\n              &lt;/div&gt;\n\n              {/* POPULAR */}\n              &lt;div className=\&quot;mt-5 flex flex-wrap justify-center gap-2\&quot;&gt;\n                &lt;span className=\&quot;text-xs text-muted-foreground self-center mr-1\&quot;&gt;Popular:&lt;/span&gt;\n                {POPULAR.map(p =&gt; (\n                  &lt;button key={p} onClick={() =&gt; setQuery(p)} className=\&quot;text-xs px-3 py-1.5 rounded-full bg-secondary hover:bg-accent transition-colors\&quot;&gt;{p}&lt;/button&gt;\n                ))}\n              &lt;/div&gt;\n\n              {/* QUICK EMERGENCY STRIP */}\n              &lt;div className=\&quot;mt-8 grid grid-cols-3 sm:grid-cols-6 gap-2 max-w-2xl mx-auto\&quot;&gt;\n                {[\n                  { n: &#39;112&#39;, label: &#39;All-in-one&#39;, Icon: Siren, cls: &#39;from-red-500 to-rose-600&#39; },\n                  { n: &#39;100&#39;, label: &#39;Police&#39;, Icon: ShieldCheck, cls: &#39;from-blue-500 to-indigo-600&#39; },\n                  { n: &#39;101&#39;, label: &#39;Fire&#39;, Icon: Flame, cls: &#39;from-orange-500 to-red-500&#39; },\n                  { n: &#39;102&#39;, label: &#39;Ambulance&#39;, Icon: Ambulance, cls: &#39;from-emerald-500 to-teal-600&#39; },\n                  { n: &#39;1091&#39;, label: &#39;Women&#39;, Icon: HeartPulse, cls: &#39;from-pink-500 to-rose-600&#39; },\n                  { n: &#39;1098&#39;, label: &#39;Child&#39;, Icon: HeartPulse, cls: &#39;from-purple-500 to-fuchsia-600&#39; },\n                ].map(({n, label, Icon, cls}) =&gt; (\n                  &lt;a key={n} href={`tel:${n}`} className={`group flex flex-col items-center justify-center gap-1 p-3 rounded-2xl bg-gradient-to-br ${cls} text-white shadow hover:shadow-xl hover:-translate-y-0.5 transition-all`}&gt;\n                    &lt;Icon className=\&quot;h-5 w-5\&quot; /&gt;\n                    &lt;div className=\&quot;text-lg font-black leading-none\&quot;&gt;{n}&lt;/div&gt;\n                    &lt;div className=\&quot;text-[10px] uppercase tracking-wider opacity-90\&quot;&gt;{label}&lt;/div&gt;\n                  &lt;/a&gt;\n                ))}\n              &lt;/div&gt;\n            &lt;/div&gt;\n          &lt;/section&gt;\n\n          {/* SEARCH RESULTS (when query active) */}\n          {query &amp;&amp; searchResults.length &gt; 0 &amp;&amp; (\n            &lt;section className=\&quot;container mx-auto max-w-6xl px-4 pb-8\&quot;&gt;\n              &lt;div className=\&quot;flex items-center justify-between mb-3\&quot;&gt;\n                &lt;h2 className=\&quot;text-lg font-bold\&quot;&gt;Results for \&quot;{query}\&quot; &lt;span className=\&quot;text-muted-foreground font-normal\&quot;&gt;· {searchResults.length}&lt;/span&gt;&lt;/h2&gt;\n              &lt;/div&gt;\n              &lt;div className=\&quot;grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3\&quot;&gt;\n                {searchResults.slice(0, 12).map(c =&gt; (\n                  &lt;ContactCard key={c.id} c={c} onOpen={openContact} onCopy={copyNumber} onFav={toggleFav} isFav={isFav(c.id)} /&gt;\n                ))}\n              &lt;/div&gt;\n            &lt;/section&gt;\n          )}\n\n          {query &amp;&amp; searchResults.length === 0 &amp;&amp; debounced &amp;&amp; (\n            &lt;section className=\&quot;container mx-auto max-w-2xl px-4 pb-8 text-center text-muted-foreground\&quot;&gt;\n              No results for \&quot;{query}\&quot;. Try a different keyword.\n            &lt;/section&gt;\n          )}\n\n          {/* CATEGORIES */}\n          {!query &amp;&amp; (\n            &lt;section className=\&quot;container mx-auto max-w-6xl px-4 py-8\&quot;&gt;\n              &lt;div className=\&quot;flex items-end justify-between mb-4\&quot;&gt;\n                &lt;div&gt;\n                  &lt;h2 className=\&quot;text-2xl font-bold\&quot;&gt;Browse by category&lt;/h2&gt;\n                  &lt;p className=\&quot;text-sm text-muted-foreground\&quot;&gt;Every important service, one tap away&lt;/p&gt;\n       