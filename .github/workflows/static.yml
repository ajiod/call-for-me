rvice: &#39;quick-contact-hub&#39;, total: CONTACTS.length }));\n    }\n\n    if (path === &#39;categories&#39;) {\n      const counts = {};\n      for (const c of CONTACTS) counts[c.category] = (counts[c.category] || 0) + 1;\n      const list = CATEGORIES.map(cat =&gt; ({ ...cat, count: counts[cat.id] || 0 }));\n      return cors(NextResponse.json({ categories: list }));\n    }\n\n    if (path === &#39;contacts&#39;) {\n      const category = url.searchParams.get(&#39;category&#39;);\n      const q = url.searchParams.get(&#39;q&#39;);\n      const limit = Math.min(parseInt(url.searchParams.get(&#39;limit&#39;) || &#39;200&#39;, 10), 500);\n      let list = CONTACTS.slice();\n      if (category) list = list.filter(c =&gt; c.category === category);\n      if (q) {\n        list = list.map(c =&gt; ({ c, s: score(c, q) })).filter(x =&gt; x.s &gt; 0).sort((a, b) =&gt; b.s - a.s).map(x =&gt; x.c);\n      }\n      return cors(NextResponse.json({ contacts: list.slice(0, limit), total: list.length }));\n    }\n\n    if (path === &#39;featured&#39;) {\n      const list = CONTACTS.filter(c =&gt; c.featured);\n      return cors(NextResponse.json({ contacts: list }));\n    }\n\n    if (path.startsWith(&#39;contacts/&#39;)) {\n      const id = path.split(&#39;/&#39;)[1];\n      const c = CONTACTS.find(x =&gt; x.id === id);\n      if (!c) return cors(NextResponse.json({ error: &#39;not found&#39; }, { status: 404 }));\n      return cors(NextResponse.json({ contact: c }));\n    }\n\n    return cors(NextResponse.json({ error: &#39;unknown route&#39;, path }, { status: 404 }));\n  } catch (e) {\n    return cors(NextResponse.json({ error: e.message }, { status: 500 }));\n  }\n}\n\nexport async function POST(request, { params }) {\n  const path = (params?.path || []).join(&#39;/&#39;);\n  try {\n    const body = await request.json().catch(() =&gt; ({}));\n    if (path === &#39;suggest&#39;) {\n      // Placeholder for phase 2 — collect suggested numbers\n      return cors(NextResponse